---
name: Release

"on":
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish ${{ github.ref_name }}
    needs: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible_collections/poto/exoscale
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/poto/exoscale
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ansible-core
        run: python -m pip install --upgrade ansible-core
      - name: Check the tag matches galaxy.yml
        run: |
          version=$(sed -n 's/^version: //p' galaxy.yml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME is not v$version"
              exit 1
          fi
      - name: Build the collection
        run: ansible-galaxy collection build
      - name: Publish to Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          if [ -z "$GALAXY_API_KEY" ]; then
              echo "::error::set the GALAXY_API_KEY repository secret"
              exit 1
          fi
          # for a private hub, add --server https://hub.example/api/galaxy/
          ansible-galaxy collection publish poto-exoscale-*.tar.gz \
              --api-key "$GALAXY_API_KEY"
      - name: Attach the tarball to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" poto-exoscale-*.tar.gz \
                  --clobber
          else
              gh release create "$GITHUB_REF_NAME" poto-exoscale-*.tar.gz \
                  --verify-tag --generate-notes
          fi
